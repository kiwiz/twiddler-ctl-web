<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Twiddler 4</title>
  <desc id="description">A cropped matrix of round and elongated chorded keyboard buttons.</desc>
  <rect width="512" height="512" rx="112" fill="#1f6feb" />

  <defs>
    <clipPath id="background-clip" clipPathUnits="userSpaceOnUse">
      <rect width="512" height="512" rx="112" />
    </clipPath>
  </defs>

  <g fill="#f8fbff" clip-path="url(#background-clip)">
    <!-- Three circular keys -->
    <circle cx="102" cy="102" r="48" />
    <circle cx="256" cy="102" r="48" />
    <circle cx="410" cy="102" r="48" />

    <!-- Vertical keys, aligned with the dot columns. -->
    <rect x="56" y="194" width="92" height="160" rx="46" />
    <rect x="210" y="194" width="92" height="160" rx="46" />
    <rect x="364" y="194" width="92" height="160" rx="46" />

    <!-- Bottom row is cropped flush at the background edge. -->
    <rect x="56" y="398" width="92" height="160" rx="46" />
    <rect x="210" y="398" width="92" height="160" rx="46" />
    <rect x="364" y="398" width="92" height="160" rx="46" />
  </g>
</svg>
